

services:
  digit-recognizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: digit-recognizer:latest
    container_name: digit_ai_service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - ./data/feedback:/app/data/feedback
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
